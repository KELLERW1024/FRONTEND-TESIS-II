<mat-card class="cardWithShadow">
  <mat-card-header>
    <mat-card-title>Distribución de planes</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="grid grid-cols-12 gap-6 items-center">
      <div class="col-span-7">
        <h4 class="text-xl">{{ totalRevenue | currency: 'PEN' : 'S/ ' }}</h4>
        <div class="text-xs text-muted mt-1">Ingresos totales por planes</div>
      </div>
      <div class="col-span-5">
        <!-- ---------------------------- -->
        <!-- charts here -->
        <!-- ---------------------------- -->
        @if (items.length > 0) {
        <apx-chart [series]="yearlyChart.series" [labels]="yearlyChart.labels" [dataLabels]="yearlyChart.dataLabels"
          [chart]="yearlyChart.chart" [legend]="yearlyChart.legend" [colors]="yearlyChart.colors"
          [stroke]="yearlyChart.stroke" [tooltip]="yearlyChart.tooltip" [plotOptions]="yearlyChart.plotOptions"
          [responsive]="yearlyChart.responsive"></apx-chart>
        }
      </div>
    </div>

    @if (items.length > 0) {
    <div class="flex flex-col gap-2 mt-4">
      @for (item of items; track item.id) {
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center min-w-0">
          <span class="size-2.5 rounded-full shrink-0" [style.background-color]="item.color"></span>
          <div class="text-xs font-normal ms-2 text-muted truncate" [title]="item.name">{{ item.name }}</div>
        </div>
        <div class="text-xs font-semibold shrink-0">{{ item.share }}%</div>
      </div>
      }
    </div>
    } @else {
    <p class="text-center text-muted text-sm py-4">Aún no hay ventas de planes.</p>
    }
  </mat-card-content>
</mat-card>
