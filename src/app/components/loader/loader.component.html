<div *ngIf="isLoading" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-2xl p-8 flex flex-col items-center max-w-sm mx-4 text-center shadow-2xl">
    
    <!-- Animación de 3 puntos (Uiverse + Tailwind) -->
    <div class="w-full gap-x-2 flex justify-center items-center py-4">
      <div class="w-5 h-5 bg-[#d991c2] rounded-full animate-bounce"></div>
      <div class="w-5 h-5 bg-[#9869b8] rounded-full animate-bounce [animation-delay:-0.2s]"></div>
      <div class="w-5 h-5 bg-[#6756cc] rounded-full animate-bounce [animation-delay:-0.4s]"></div>
    </div>

    <!-- Textos personalizables -->
    <h3 class="text-lg font-bold text-gray-800 mt-2">{{ title }}</h3>
    <p class="text-sm text-gray-500 mt-1">{{ description }}</p>

  </div>
</div>
