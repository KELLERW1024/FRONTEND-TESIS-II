<mat-card class="cardWithShadow">
  <mat-card-content class="pb-0!">
    <mat-card-title class="mb-3">Rendimiento por plan</mat-card-title>
    <br>
    <div class="relative overflow-auto">
      <table mat-table [dataSource]="dataSource" class="min-w-full">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">Plan</th>
          <td class="whitespace-nowrap" mat-cell *matCellDef="let element">
            <div class="flex items-center">
              <span class="size-2.5 rounded-full shrink-0"></span>
              <h6 class="text-sm font-semibold ms-2">{{ element.name }}</h6>
            </div>
          </td>
        </ng-container>

        <!-- Subscriptions Column -->
        <ng-container matColumnDef="subscriptions">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">Suscripciones</th>
          <td class="whitespace-nowrap text-muted" mat-cell *matCellDef="let element">
            {{ element.subscriptions }}
          </td>
        </ng-container>

        <!-- Share Column -->
        <ng-container matColumnDef="share">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">% de ingresos</th>
          <td class="whitespace-nowrap" mat-cell *matCellDef="let element">
            <span class="text-white rounded-full font-semibold px-[7px] py-1 text-xs" [style.background-color]="planColor(element.id)">
              {{ element.share }}%
            </span>
          </td>
        </ng-container>

        <!-- Revenue Column -->
        <ng-container matColumnDef="revenue">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">Ingresos</th>
          <td class="whitespace-nowrap font-semibold" mat-cell *matCellDef="let element">
            {{ element.revenue | currency: 'PEN' : 'S/ ' }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      @if (dataSource.length === 0) {
        <p class="text-center text-muted text-sm py-6">Aún no hay planes para mostrar.</p>
      }
    </div>
    <br>
  </mat-card-content>
</mat-card>
