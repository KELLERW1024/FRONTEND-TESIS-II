<mat-card class="bg-light-secondary px-6 py-3" >
  <div class="flex justify-between items-center">
    <div class="flex gap-3">

      <div>
        <mat-card-title>Conversations</mat-card-title>
        <!-- <mat-card-subtitle>Check your reports</mat-card-subtitle> -->
      </div>
    </div>
    <div class="hidden lg:block">
      <img src="/assets/images/backgrounds/customer-support-img.png" alt="customer-support-img"
        class="img-fluid mb-[-12px]" />
    </div>
  </div>
</mat-card>
<mat-card class="cardWithShadow theme-card">
  <div class="p-6">
    <mat-card-title class="mb-0">Interacciones IA</mat-card-title>
  </div>

  <mat-card-content class="border-t border-border">
    <div class="relative overflow-auto">
      <table mat-table [dataSource]="dataSource1" class="min-w-full">
        <!-- Position Column -->
        <ng-container matColumnDef="plan">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm pl-0!">
            Suscripcion
          </th>
          <td mat-cell *matCellDef="let element" class="pl-0! whitespace-nowrap">
            <div class="flex items-center gap-4">
              <h6 class="text-sm font-semibold">
                {{ element.plan_name }}
              </h6>
            </div>
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">
            Conversation
          </th>
          <td mat-cell *matCellDef="let element" class="whitespace-nowrap">
            <h6 class=" text-base mb-1">
              <span class="text-dark font-semibold">
                {{ element.title }}
              </span>
            </h6>


          </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm text-center!">
            Status
          </th>
          <td mat-cell *matCellDef="let element" class="text-center! whitespace-nowrap">

            @if(element.status == 'active') {

            <span class="bg-light-success text-success rounded font-semibold p-6 py-1 text-xs">
              Activo
            </span>

            }

            @if(element.status == 'completed') {

            <span class="bg-light-primary text-primary rounded font-semibold p-6 py-1 text-xs">
              Completado
            </span>

            }

            @if(element.status == 'archived') {

            <span class="bg-light-warning text-warning rounded font-semibold p-6 py-1 text-xs">
              Archivado
            </span>

            }

          </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm"></th>
          <td mat-cell *matCellDef="let element" class="text-end! whitespace-nowrap">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item  [routerLink]="['/conversations/view', element.id]">
                <mat-icon>add</mat-icon>
                <span>View</span>
              </button>
               <button mat-menu-item  [routerLink]="['/conversations/edit', element.id]">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item>
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns1"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns1"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
