<!-- ============================================ -->
<!-- BOTÓN REGRESAR -->
<!-- ============================================ -->

<div class="mb-5">

    <button
        mat-stroked-button
        color="primary"
        class="back-button"
        (click)="goBack()"
    >
        <mat-icon>arrow_back</mat-icon>

        <span>
            Regresar
        </span>
    </button>

</div>


<!-- ============================================ -->
<!-- CONTENEDOR PRINCIPAL -->
<!-- ============================================ -->

<mat-card class="theme-card plan-card">


    <!-- ======================================== -->
    <!-- HEADER DEL PLAN -->
    <!-- ======================================== -->

<div class="plan-header">

    <div class="plan-icon">
        <mat-icon>
            menu_book
        </mat-icon>
    </div>

    <div class="plan-header-content">

        <span class="plan-label">
            PLAN DE ESTUDIO
        </span>

        <h1 class="plan-title">
            {{ plan?.name }}
        </h1>

    </div>

    <!-- BOTÓN -->
    <button
        mat-raised-button
        color="primary "
        class="structure-button"
        (click)="closeStructura()"
    >
        <mat-icon>account_tree</mat-icon>

        Guardar estructura
    </button>

</div>



    <!-- ======================================== -->
    <!-- CONTENIDO -->
    <!-- ======================================== -->

    <mat-card-content class="plan-content">

        <div class="plan-tree">


            <!-- ================================== -->
            <!-- ÁRBOL -->
            <!-- ================================== -->
             <div class="plan-tree">

    <ng-container
        *ngTemplateOutlet="
            nodeTemplate;
            context: {
                $implicit: planNode,
                parentCode: ''
            }
        "
    >
    </ng-container>

</div>

<!-- 
            <ng-container
                *ngFor="let node of planNode"
            >

                <ng-container
                    *ngTemplateOutlet="
                        nodeTemplate;
                        context: { $implicit: node }
                    "
                >
                </ng-container>

            </ng-container> -->


            <!-- ================================== -->
            <!-- PLANTILLA RECURSIVA -->
            <!-- ================================== -->

           <ng-template
    #nodeTemplate
    let-nodes
    let-parentCode="parentCode"
>

    <ng-container *ngFor="let node of nodes">

        <!-- ========================= -->
        <!-- NODO -->
        <!-- ========================= -->

        <div
            class="chapter"
            *ngIf="node.nivel === 1"
        >

            <div class="chapter-icon">

                <mat-icon>
                    folder_open
                </mat-icon>

            </div>


            <div class="chapter-content">

                <span class="chapter-label">

                    CAPÍTULO
                    {{ getNodeCode(node, parentCode) }}

                </span>


                <h2 class="chapter-title">

                    {{ node.titulo }}

                </h2>

            </div>


            <button
                mat-icon-button
                [matMenuTriggerFor]="nodeMenu"
                [matMenuTriggerData]="{ node: node }"
            >

                <mat-icon>
                    more_vert
                </mat-icon>

            </button>

        </div>


        <!-- ========================= -->
        <!-- SUBNODO -->
        <!-- ========================= -->

        <div
            class="subchapter"
            *ngIf="node.nivel > 1"
            [style.margin-left.px]="(node.nivel - 2) * 32"
        >

            <div class="subchapter-line"></div>


            <div class="subchapter-content">

                <span class="subchapter-code">

                    {{ getNodeCode(node, parentCode) }}

                </span>


                <span class="subchapter-title">

                    {{ node.titulo }}

                </span>

            </div>


            <button
                mat-icon-button
                class="subchapter-menu-button"
                [matMenuTriggerFor]="nodeMenu"
                [matMenuTriggerData]="{ node: node }"
                aria-label="Opciones del nodo"
            >

                <mat-icon>
                    more_vert
                </mat-icon>

            </button>

        </div>


        <!-- ========================= -->
        <!-- HIJOS -->
        <!-- ========================= -->

        <ng-container
            *ngIf="node.children?.length"
        >

            <ng-container
                *ngTemplateOutlet="
                    nodeTemplate;
                    context: {
                        $implicit: node.children,
                        parentCode: getNodeCode(node, parentCode)
                    }
                "
            >
            </ng-container>

        </ng-container>

    </ng-container>

</ng-template>



            <!-- ================================== -->
            <!-- MENÚ DE NODO -->
            <!-- ================================== -->

            <mat-menu #nodeMenu="matMenu">


                <ng-template
                    matMenuContent
                    let-node="node"
                >


                    <!-- ============================== -->
                    <!-- EDITAR -->
                    <!-- ============================== -->

                    <button
                        mat-menu-item
                        (click)="editNode(node)"
                    >

                        <mat-icon>
                            edit
                        </mat-icon>

                        <span>
                            Editar
                        </span>

                    </button>



                    <!-- ============================== -->
                    <!-- AGREGAR DEBAJO -->
                    <!-- ============================== -->

                    <button
                        mat-menu-item
                        (click)="addSibling(node)"
                    >

                        <mat-icon>
                            add
                        </mat-icon>

                        <span>
                            Agregar debajo
                        </span>

                    </button>



                    <!-- ============================== -->
                    <!-- AGREGAR HIJO -->
                    <!-- ============================== -->

                    <button
                        mat-menu-item
                        (click)="addChild(node)"
                    >

                        <mat-icon>
                            subdirectory_arrow_right
                        </mat-icon>

                        <span>
                            Agregar hijo
                        </span>

                    </button>



                    <!-- ============================== -->
                    <!-- MOVER -->
                    <!-- ============================== -->

                    <button
                        mat-menu-item
                        (click)="moveNode(node)"
                    >

                        <mat-icon>
                            swap_vert
                        </mat-icon>

                        <span>
                            Mover
                        </span>

                    </button>



                    <!-- ============================== -->
                    <!-- DIVISOR -->
                    <!-- ============================== -->

                    <mat-divider></mat-divider>



                    <!-- ============================== -->
                    <!-- ELIMINAR -->
                    <!-- ============================== -->

                    <button
                        mat-menu-item
                        class="delete-menu-item"
                        (click)="deleteNode(node)"
                    >

                        <mat-icon>
                            delete
                        </mat-icon>

                        <span>
                            Eliminar
                        </span>

                    </button>


                </ng-template>

            </mat-menu>


        </div>

    </mat-card-content>

</mat-card>
