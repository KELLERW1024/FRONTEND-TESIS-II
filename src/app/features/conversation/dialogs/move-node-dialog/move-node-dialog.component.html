<h2 mat-dialog-title>
    Mover nodo
</h2>

<mat-dialog-content>

    <div class="node-info">

        <span class="node-label">
            Nodo
        </span>

        <strong>
            {{ data.node.titulo }}
        </strong>

    </div>


    <mat-form-field
        appearance="outline"
        class="w-100"
    >

        <mat-label>
            Nueva posición
        </mat-label>

        <mat-select
            [(ngModel)]="orden"
        >

            <mat-option
                *ngFor="let position of positions"
                [value]="position"
            >

                {{ position }}

            </mat-option>

        </mat-select>

    </mat-form-field>

</mat-dialog-content>


<mat-dialog-actions align="end">

    <button
        mat-button
        type="button"
        (click)="cancelar()"
    >
        Cancelar
    </button>

    <button
        mat-flat-button
        color="primary"
        type="button"
        (click)="mover()"
    >
        <mat-icon>swap_vert</mat-icon>
        Mover
    </button>

</mat-dialog-actions>
