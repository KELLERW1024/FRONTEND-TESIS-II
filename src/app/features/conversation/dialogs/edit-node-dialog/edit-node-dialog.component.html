<h2 mat-dialog-title>

    <mat-icon>edit</mat-icon>

    Editar nodo

</h2>


<mat-dialog-content>

    <div class="node-info">

        <span class="node-code">
            {{ data.node.codigo || 'Sin código' }}
        </span>

        <span class="node-level">
            Nivel {{ data.node.nivel }}
        </span>

    </div>


    <mat-form-field
        appearance="outline"
        class="full-width"
    >

        <mat-label>Título</mat-label>

        <input
            matInput
            [(ngModel)]="titulo"
            maxlength="200"
            placeholder="Ingrese el título"
        />

        <mat-hint align="end">
            {{ titulo.length }}/200
        </mat-hint>

    </mat-form-field>


    <mat-form-field
        appearance="outline"
        class="full-width"
    >

        <mat-label>Objetivo</mat-label>

        <textarea
            matInput
            [(ngModel)]="objective"
            rows="5"
            placeholder="Ingrese el objetivo"
        ></textarea>

    </mat-form-field>

</mat-dialog-content>


<mat-dialog-actions align="end">

    <button
        mat-button
        type="button"
        (click)="cancelar()"
    >
        Cancelar
    </button>


    <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="!titulo.trim()"
        (click)="guardar()"
    >

        <mat-icon>save</mat-icon>

        Guardar

    </button>

</mat-dialog-actions>
