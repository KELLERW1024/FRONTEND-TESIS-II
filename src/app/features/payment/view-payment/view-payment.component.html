<!-- CONTENT -->
<mat-card class="cardWithShadow theme-card">
    <!-- ACTION BAR -->
    <div class="p-6 flex justify-between items-center">
        <mat-card-title class="mb-0">
            Pagos
        </mat-card-title>
    </div>

    <mat-card-content class="border-t border-border">
        <!-- TABLE / CONTENT AREA -->

    </mat-card-content>
    <div class="container">

        <mat-form-field appearance="outline" style="width: 100%;">
            <mat-label>Buscar pago</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ej: SAVE10">
        </mat-form-field>

        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

            <!-- Code -->
            <ng-container matColumnDef="user">
                <th mat-header-cell *matHeaderCellDef> Usuario </th>
                <td mat-cell *matCellDef="let conversation">{{ conversation.user?.name }}</td>
            </ng-container>

            <ng-container matColumnDef="plan">
                <th mat-header-cell *matHeaderCellDef> Plan</th>
                <td mat-cell *matCellDef="let conversation">{{ conversation.plan_name}}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let conversation">{{ conversation.status}}</td>
            </ng-container>

            <ng-container matColumnDef="status_payment">
                <th mat-header-cell *matHeaderCellDef> Status payment </th>
                <td mat-cell *matCellDef="let conversation">
                    <span *ngFor="let payment of conversation.payments; let last = last">
                        {{ payment.status }}<span *ngIf="!last">, </span>
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef> Opciones </th>
                <td mat-cell *matCellDef="let conversation">{{ conversation.status}}</td>
            </ng-container>

            <!-- Header & Rows -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
        </mat-paginator>

    </div>

</mat-card>
