<div class="max-w-4xl mx-auto p-6">
  <!-- Card Principal -->
  <div class="bg-white rounded-2xl border border-border shadow-xs p-6 sm:p-8">
    
    <!-- Encabezado -->
    <div class="flex items-center gap-4 pb-6 border-b border-border">
      <img src="/assets/images/profile/user-1.jpg" alt="Foto de perfil" class="rounded-full size-16 object-cover border border-border" />
      <div>
        <h2 class="text-xl font-bold text-gray-800">Mi Perfil</h2>
        <p class="text-sm text-gray-500">Administra tu información personal y credenciales de acceso</p>
      </div>
    </div>

    <!-- Alertas -->
    @if(messageSuccess) {
      <div class="mt-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg">
        {{ messageSuccess }}
      </div>
    }
    @if(messageError) {
      <div class="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg">
        {{ messageError }}
      </div>
    }
    
    <!-- Formulario -->
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-6">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input formControlName="name" type="text"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
          <input formControlName="last_name" type="text"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
        <input formControlName="email" type="email"
          class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg text-sm text-gray-500 cursor-not-allowed focus:outline-none" />
        <span class="text-xs text-gray-400">El correo de la cuenta no se puede modificar directamente.</span>
      </div>

      <hr class="border-border my-6" />

      <!-- Cambio de Contraseña -->
      <h3 class="text-base font-semibold text-gray-800">Seguridad</h3>
      <p class="text-xs text-gray-500 -mt-4">Deja estos campos vacíos si no deseas cambiar tu contraseña.</p>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña actual</label>
          <input formControlName="current_password" type="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
          <input formControlName="new_password" type="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar nueva contraseña</label>
          <input formControlName="new_password_confirmation" type="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none" />
        </div>
      </div>

      <!-- Botón de guardar -->
      <div class="flex justify-end pt-4">
        <button mat-flat-button color="primary" type="submit" [disabled]="loading || profileForm.invalid"
          class="bg-blue-600 text-white! px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
          {{ loading ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </div>

    </form>
  </div>
</div>
